# ============================================
# ZeroExo Backend - Docker Compose (后端独立部署)
# ============================================
# 注意: 推荐使用项目根目录的 docker-compose.yml 或
# docker-compose.build.yml 进行完整部署。
# 此文件仅用于后端独立开发调试。
# ============================================

services:
  # ========== 基础设施 ==========
  postgres:
    image: postgres:16
    container_name: zeroexo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zeroexo
      POSTGRES_PASSWORD: zeroexo
      POSTGRES_DB: zeroexo
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zeroexo -d zeroexo']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zeroexo

  redis:
    image: redis:7-alpine
    container_name: zeroexo-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zeroexo

  minio:
    image: minio/minio:latest
    container_name: zeroexo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zeroexo

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  zeroexo:
    driver: bridge
